name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # 项目只用标准库，没有 go.sum，关掉依赖缓存
          cache: false

      - name: 静态检查
        run: go vet ./...

      - name: 测试
        run: go test -race ./...

      - name: 交叉编译 windows/amd64
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: feishu-token-proxy-windows-amd64
          path: dist/
          if-no-files-found: error

  # 推送 v* tag 时把产物打成 zip 发布为 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: feishu-token-proxy-windows-amd64
          path: dist

      - name: 打包并发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pkg="feishu-token-proxy-${TAG}-windows-amd64.zip"
          (cd dist && zip -9 "../${pkg}" feishu-token-proxy.exe config.example.json)
          sha256sum "${pkg}" > "${pkg}.sha256"
          gh release create "${TAG}" "${pkg}" "${pkg}.sha256" \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${TAG}" --generate-notes
