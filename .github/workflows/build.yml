name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # 项目只用标准库，没有 go.sum，关掉依赖缓存
          cache: false

      - name: 静态检查
        run: go vet ./...

      - name: 测试
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: 交叉编译并打包全部平台
        env:
          # tag 构建用 tag 名作版本，其余由 build.sh 取 git describe
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: feishu-token-proxy
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # 推送 v* tag 时把各平台压缩包和 SHA256SUMS 发布为 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: feishu-token-proxy
          path: dist

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS
          gh release create "${TAG}" *.zip *.tar.gz SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${TAG}" --generate-notes
